# Configuração do sdd-wk para este projeto.
# É um arquivo shell (key=value) lido com `source` pelo sdd.sh, pelas skills e pelos agentes.
# Tudo o que depende da linguagem/stack mora aqui — skills e agentes são genéricos.

PROJETO="Portfólio Wagner Kauan"

# Comandos do projeto, rodados na raiz. Vazio = etapa inexistente.
CMD_BUILD="npm run build"
CMD_TESTE="npm test"
# Prefixo para rodar só parte dos testes: o filtro é acrescentado ao final (ex.: "npm test -- -t").
CMD_TESTE_FILTRO="npm test -- -t"
CMD_LINT=""

# Camadas: CAMADA_<n>="nome|glob,glob,...|agente"
# O agente é um subagente do Claude Code (globais: sdd-backend, sdd-frontend; ou um de .claude/agents/).
# Os globs usam a sintaxe de padrão do bash: * casa qualquer coisa, inclusive "/".
# Projeto de uma camada só: deixe apenas CAMADA_1.
CAMADA_1="frontend|index.html,src/*,public/*,tests/*,scripts/*,vite.config.js,package.json,package-lock.json,README.md,DESIGN.md,.impeccable/design.json|sdd-frontend"

# Raízes de código: caminhos citados nas specs que começam por elas contam na análise de conflito,
# mesmo sem crase.
RAIZES_CODIGO="src,public,tests,scripts"

# Pontos de serialização: arquivos/pastas que duas specs nunca alteram em paralelo
# (registro de DI, rotas, migrations, manifesto de dependências...). Pasta termina com "/".
PONTOS_SERIALIZACAO="package.json,package-lock.json,src/styles/tokens.css"

# Arquivos ou pastas locais fora do controle de versão que a worktree paralela precisa (.env, config
# local, CLAUDE.md e .claude/agents quando estão no .gitignore). settings.local.json nunca é copiado.
ARQUIVOS_LOCAIS=".env,.claude/agents,.claude/skills/impeccable,.agents/skills/impeccable"

# Recurso externo dos testes (opcional), para cada terminal/worktree testar no seu próprio banco.
# RECURSO_TESTE_VAR: variável de ambiente que a suíte lê (ex.: "APP_TEST_DB_CONNECTION").
# RECURSO_TESTE_ORIGEM: arquivo local de onde vem a credencial, lida na hora e nunca impressa.
# RECURSO_TESTE_BASE: nome base; cada execução usa <base>_spec<N> ou <base>_integrado.
RECURSO_TESTE_VAR=""
RECURSO_TESTE_ORIGEM=""
RECURSO_TESTE_BASE=""

# Commits: o agente NUNCA commita. Ele sempre entrega o bloco "git add <arquivos>" + "git commit -m"
# em Conventional Commits (feat, fix, chore, refactor, test, docs, perf, build, ci, style) para você
# rodar. Não há opção para mudar isso.
